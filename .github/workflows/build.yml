name: Build PlugY

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build PlugY.dll (Release|Win32)
        run: msbuild .github\build\PlugY.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      # Same layout as the Diablo II folder : PlugY.dll next to Game.exe, data files in PlugY\.
      - name: Collect files
        run: |
          New-Item -ItemType Directory -Force artifact\PlugY | Out-Null
          Copy-Item build\Release\PlugY.dll, build\Release\PlugY.pdb artifact\
          Copy-Item PlugYInstaller\PlugY\* artifact\PlugY\

      - uses: actions/upload-artifact@v4
        with:
          name: PlugY
          path: artifact/

      # Tag push : publish the artifact files as a release (the tag name is the release name).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path artifact\* -DestinationPath "PlugY-$env:GITHUB_REF_NAME.zip"
          gh release create "$env:GITHUB_REF_NAME" "PlugY-$env:GITHUB_REF_NAME.zip" --title "PlugY $env:GITHUB_REF_NAME" --generate-notes
