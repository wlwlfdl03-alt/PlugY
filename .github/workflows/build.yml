name: Build PlugY

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build PlugY.dll (Release|Win32)
        run: msbuild .github\build\PlugY.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      - uses: actions/upload-artifact@v4
        with:
          name: PlugY
          path: |
            build/Release/PlugY.dll
            build/Release/PlugY.pdb
